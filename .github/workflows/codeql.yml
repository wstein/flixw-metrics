name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Overlay databases require build-mode none; retain the more accurate traced Mill build.
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile the analyzer
        run: |
          sh scripts/fetch-flix.sh
          ./mill --no-server plugin.compile
      - uses: github/codeql-action/analyze@v4

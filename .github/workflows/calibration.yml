name: calibration

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibration
  cancel-in-progress: false

jobs:
  pinned-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Measure and verify pinned corpus
        run: sh scripts/calibrate-corpus.sh calibration-results
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-reports
          path: calibration-results
          if-no-files-found: warn
          retention-days: 30

name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned SDK revision
        id: sdk-pin
        run: echo "revision=$(awk -F= '$1 == "revision" {print $2}' sdk-source.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: wstein/flixw-plugin-sdk
          ref: ${{ steps.sdk-pin.outputs.revision }}
          path: .sdk-source
      - name: Select the SDK source checkout
        run: echo "FLIXW_SDK_SOURCE=$GITHUB_WORKSPACE/.sdk-source" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sh scripts/test.sh
      - name: Check the plugin and embedded SDK API documentation
        run: ./mill --no-server plugin.docJar
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install check-jsonschema==0.38.0
      - name: Validate generated native report against JSON Schema
        run: sh scripts/validate-report-schema.sh

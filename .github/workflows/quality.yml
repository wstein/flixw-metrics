name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sh scripts/test.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install check-jsonschema==0.38.0
      - name: Validate generated native report against JSON Schema
        run: sh scripts/validate-report-schema.sh
